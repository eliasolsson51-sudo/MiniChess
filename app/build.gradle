plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'app.minichess'
    compileSdk 34

    defaultConfig {
        applicationId 'app.minichess'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "0.1.${runNumber}"
    }

    // Fixed key so every new build installs over the old one (adb install -r).
    signingConfigs {
        shared {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
