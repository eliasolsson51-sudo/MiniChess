name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon

      # MiniSpot needs a newer Gradle; its own wrapper JAR is not used (it failed validation).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build MiniSpot (modified)
        working-directory: minispot
        run: |
          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' "$GITHUB_WORKSPACE/debug.keystore" > keystore.properties
          gradle assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MiniChess.apk
          cp autodark/build/outputs/apk/release/autodark-release.apk AutoDark.apk
          cp minisettings/build/outputs/apk/release/minisettings-release.apk MiniSettings.apk
          cp minimouse/build/outputs/apk/release/minimouse-release.apk MiniMouse.apk
          cp minispot/app/build/outputs/apk/release/app-release.apk MiniSpot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MiniChess build ${{ github.run_number }}
          files: |
            MiniChess.apk
            AutoDark.apk
            MiniSettings.apk
            MiniMouse.apk
            MiniSpot.apk
          make_latest: true
