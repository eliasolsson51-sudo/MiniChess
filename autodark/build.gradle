plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'app.autodark'
    compileSdk 34

    defaultConfig {
        applicationId 'app.autodark'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "0.1.${runNumber}"
    }

    signingConfigs {
        shared {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // WRITE_SECURE_SETTINGS is granted by hand with adb (pm grant), which lint can't know.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
